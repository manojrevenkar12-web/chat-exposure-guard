name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests bench
      - run: ruff format --check src tests bench
      - run: mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: ceg_test}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CEG_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ceg_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev,scanners]"
      - name: tests (unit, database, real scanners, benchmark)
        run: |
          set +e
          pytest -q -rfE -p no:cacheprovider 2>&1 | tee pytest.txt
          rc=${PIPESTATUS[0]}
          grep -E "^(FAILED|ERROR) " pytest.txt | sed 's/^/::error::/'
          grep -E "skipped" pytest.txt | tail -1 | sed 's/^/::notice::/'
          exit $rc
      - name: prompt-injection gate (dev corpus, every defence on)
        run: ceg aisec --out aisec.md || { echo "::error::an attack succeeded or a benign conversation broke"; exit 1; }
      - name: deduplication benchmark
        run: python bench/dedup.py > bench.md || { echo "::error::the tracker made errors on the benchmark history"; exit 1; }
      - name: held-out sets (reported, not gating)
        run: |
          for s in heldout/*/; do
            [ -f "$s/STATUS" ] && [ "$(cat $s/STATUS)" = regression ] && continue
            ceg heldout "$s" | tail -n +1 >> heldout.md || echo "::warning::held-out set $s did not run"
          done
      - run: cat aisec.md bench.md heldout.md >> "$GITHUB_STEP_SUMMARY"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t ceg:ci .
      - run: docker run --rm ceg:ci --help
