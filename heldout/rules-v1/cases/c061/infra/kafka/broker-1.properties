broker.id=1
listeners=SASL_SSL://0.0.0.0:9094
advertised.listeners=SASL_SSL://kafka-1.kafka.lumachat.internal:9094
listener.security.protocol.map=SASL_SSL:SASL_SSL
inter.broker.listener.name=SASL_SSL

sasl.enabled.mechanisms=SCRAM-SHA-512
sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512
listener.name.sasl_ssl.scram-sha-512.sasl.jaas.config=${file:/etc/kafka/secrets/creds.properties:broker.jaas}

config.providers=file
config.providers.file.class=org.apache.kafka.common.config.provider.FileConfigProvider

ssl.keystore.type=PKCS12
ssl.keystore.location=/etc/kafka/secrets/kafka-1.keystore.p12
ssl.keystore.password=${file:/etc/kafka/secrets/creds.properties:keystore.password}
ssl.key.password=${file:/etc/kafka/secrets/creds.properties:key.password}
ssl.truststore.type=PKCS12
ssl.truststore.location=/etc/kafka/secrets/truststore.p12
ssl.truststore.password=${file:/etc/kafka/secrets/creds.properties:truststore.password}

authorizer.class.name=kafka.security.authorizer.AclAuthorizer
allow.everyone.if.no.acl.found=false
super.users=User:kafka-admin

zookeeper.connect=zk-0.zk.lumachat.internal:2181,zk-1.zk.lumachat.internal:2181/kafka
log.dirs=/var/lib/kafka/data
default.replication.factor=3
min.insync.replicas=2
