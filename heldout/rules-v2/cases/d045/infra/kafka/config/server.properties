# Kafka broker for chat event streams (chat.messages.v1, memory.extracted.v1)
broker.id=1
process.roles=broker
node.id=1
controller.quorum.voters=101@kafka-ctl-0.data.kindred.internal:9093
controller.listener.names=CONTROLLER

listeners=PLAINTEXT://0.0.0.0:9092
advertised.listeners=PLAINTEXT://kafka-1.data.kindred.internal:9092
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:SSL
inter.broker.listener.name=PLAINTEXT

num.network.threads=6
num.io.threads=12
log.dirs=/var/lib/kafka/data
num.partitions=12
default.replication.factor=3
min.insync.replicas=2
log.retention.hours=168
auto.create.topics.enable=false
