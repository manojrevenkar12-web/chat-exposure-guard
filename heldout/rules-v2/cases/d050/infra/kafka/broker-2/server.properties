broker.id=2
listeners=EXTERNAL://0.0.0.0:9094,INTERNAL://0.0.0.0:9093,LOCAL://127.0.0.1:9092
advertised.listeners=EXTERNAL://kafka-2.data.kindred.internal:9094,INTERNAL://kafka-2.kafka.data.svc:9093,LOCAL://127.0.0.1:9092
listener.security.protocol.map=EXTERNAL:SASL_SSL,INTERNAL:SASL_SSL,LOCAL:PLAINTEXT
inter.broker.listener.name=INTERNAL
sasl.enabled.mechanisms=SCRAM-SHA-512
sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512
ssl.keystore.location=/etc/kafka/tls/broker.keystore.p12
ssl.keystore.type=PKCS12
ssl.truststore.location=/etc/kafka/tls/truststore.p12
ssl.truststore.type=PKCS12
ssl.client.auth=none
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=false
log.dirs=/var/lib/kafka/data
