apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-writer
  namespace: chat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: memory-writer
  template:
    metadata:
      labels:
        app: memory-writer
    spec:
      containers:
        - name: writer
          image: registry.kindred.chat/memory-writer:2026.10.1
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: memory-db
                  key: password
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-keys
                  key: openai
