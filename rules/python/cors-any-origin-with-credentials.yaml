rules:
  - id: ceg.cors-any-origin-with-credentials
    message: >-
      CORS allows every origin together with credentials. Any website a signed-in user visits can call
      the API with their session and read the responses, conversations included.
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
      ceg-severity: high
      family: cors-credentials-wildcard
    pattern-either:
      - pattern: $APP.add_middleware(CORSMiddleware, ..., allow_origins=["*"], ..., allow_credentials=True, ...)
      - pattern: $APP.add_middleware(CORSMiddleware, ..., allow_credentials=True, ..., allow_origins=["*"], ...)
      - pattern: $APP.add_middleware(CORSMiddleware, ..., allow_origin_regex=".*", ..., allow_credentials=True, ...)
      - pattern: $APP.add_middleware(CORSMiddleware, ..., allow_credentials=True, ..., allow_origin_regex=".*", ...)
      # hand-written middleware that reflects any Origin with credentials (held-out set rules-v1)
      - patterns:
          - pattern: |
              $R.headers["Access-Control-Allow-Origin"] = $O
              ...
              $R.headers["Access-Control-Allow-Credentials"] = "true"
          - pattern-not: |
              $R.headers["Access-Control-Allow-Origin"] = "..."
              ...
          - pattern-not-inside: |
              if <... $O in $ALLOWED ...>:
                  ...
          - pattern-not-inside: |
              if <... $O ...> and <... $O in $ALLOWED ...>:
                  ...
