[project]
name = "chat-exposure-guard"
version = "0.1.0"
description = "Application security programme for an AI companion platform: every path to users' private chats, found, deduplicated, prioritised and tracked."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pydantic>=2.8",
  "pyyaml>=6",
  "typer>=0.12",
  "httpx>=0.27",
  "python-hcl2>=4.3",
]

[project.optional-dependencies]
scanners = ["semgrep==1.79.0", "bandit==1.9.4"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
ceg = "ceg.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ceg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "db: needs PostgreSQL (CEG_TEST_DATABASE_URL)",
  "scanners: needs semgrep and bandit on PATH",
  "slow: runs the benchmark (about 30 seconds)",
]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "S603", "S607"]
"src/ceg/cli.py" = ["B008"]
"bench/*.py" = ["E501", "S603", "S607"]
"examples/**" = ["ALL"]
"heldout/**" = ["ALL"]
"rules/**" = ["ALL"]
"bench/fixtures/**" = ["ALL"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
files = ["src/ceg"]
