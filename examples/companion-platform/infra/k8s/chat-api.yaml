apiVersion: v1
kind: Service
metadata:
  name: chat-api
  namespace: app
spec:
  type: LoadBalancer
  selector: {app: chat-api}
  ports:
    - name: https
      port: 443
      targetPort: 8443
---
apiVersion: v1
kind: Service
metadata:
  name: chat-db
  namespace: data
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector: {app: chat-db}
  ports:
    - name: postgres
      port: 5432
